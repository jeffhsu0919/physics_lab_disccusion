<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Physics Lab Discussion | 學生作答頁</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-900">
    <main class="mx-auto grid max-w-4xl gap-5 p-4">
      <header class="rounded-lg bg-white p-5 shadow-sm">
        <p class="text-sm font-semibold text-cyan-700">Student Answer Sheet</p>
        <h1 id="courseTitle" class="mt-1 text-2xl font-bold">學生作答頁</h1>
      </header>

      <section class="rounded-lg bg-white p-4 shadow-sm">
        <p id="authStatusTitle" class="font-bold text-slate-900">正在建立學生裝置驗證...</p>
        <p id="authStatusDetail" class="mt-1 text-sm text-slate-600"></p>
        <p id="studentUidText" class="mt-2 hidden select-text break-all font-mono text-sm text-slate-700"></p>
        <div id="databaseStatusBox" class="mt-3 hidden rounded-lg border border-amber-300 bg-amber-50 p-3 text-sm text-amber-900">
          <p id="databaseStatusTitle" class="font-bold">資料狀態</p>
          <p id="databaseStatusDetail" class="mt-1"></p>
        </div>
      </section>

      <section class="rounded-lg bg-white p-5 shadow-sm">
        <h2 class="mb-3 text-lg font-bold">組別選擇</h2>
        <div class="grid gap-3 sm:grid-cols-[1fr_1fr_auto]">
          <label class="grid gap-2">
            <span class="font-semibold">組別</span>
            <select id="groupSelect" class="rounded-lg border border-slate-300 px-3 py-3 text-lg disabled:bg-slate-100"></select>
          </label>
          <label class="grid gap-2">
            <span class="font-semibold">組別驗證碼</span>
            <input
              id="groupCodeInput"
              type="text"
              inputmode="numeric"
              maxlength="6"
              autocomplete="off"
              class="rounded-lg border border-slate-300 px-3 py-3 text-lg disabled:bg-slate-100"
              placeholder="6 位數驗證碼"
            />
          </label>
          <button id="confirmGroupButton" class="self-end rounded-lg bg-cyan-700 px-5 py-3 font-bold text-white hover:bg-cyan-800 disabled:bg-slate-400">
            驗證並確認組別
          </button>
        </div>
        <div class="mt-3 flex flex-col gap-2 sm:flex-row">
          <button id="changeGroupButton" class="hidden rounded-lg border border-slate-300 bg-white px-4 py-2 font-bold text-slate-900 hover:bg-slate-50">
            更換組別
          </button>
          <button id="cancelChangeGroupButton" class="hidden rounded-lg border border-slate-300 bg-white px-4 py-2 font-bold text-slate-900 hover:bg-slate-50">
            取消更換
          </button>
        </div>
        <p id="groupHint" class="mt-2 text-sm text-slate-500">請先選擇並確認組別。</p>
      </section>

      <section class="rounded-lg bg-white p-5 shadow-sm">
        <div class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
          <div>
            <p class="text-sm font-semibold text-slate-500">目前題目</p>
            <p id="questionText" class="mt-2 whitespace-pre-wrap text-xl font-semibold leading-relaxed">等待老師發布題目</p>
          </div>
          <div class="shrink-0 rounded-lg bg-slate-950 px-4 py-3 text-white">
            <p class="text-sm text-slate-300">倒數時間</p>
            <p id="timer" class="font-mono text-4xl font-black">--:--</p>
            <p id="timerStatus" class="text-sm text-slate-300">尚未開始</p>
          </div>
        </div>
      </section>

      <section class="rounded-lg bg-white p-5 shadow-sm">
        <h2 class="mb-4 text-lg font-bold">作答區域</h2>
        <div class="grid gap-4">
          <label class="grid gap-2">
            <span class="font-semibold">文字回答</span>
            <textarea
              id="answerInput"
              class="min-h-36 rounded-lg border border-slate-300 px-3 py-2 text-lg disabled:bg-slate-100"
              placeholder="可使用 LaTeX 語法，例如 $E=mc^2$"
            ></textarea>
          </label>

          <label class="grid gap-2">
            <span class="font-semibold">參考網址</span>
            <input
              id="urlInput"
              type="url"
              class="rounded-lg border border-slate-300 px-3 py-2 text-lg disabled:bg-slate-100"
              placeholder="https://example.com"
            />
          </label>

          <div>
            <div class="mb-2 flex items-center justify-between">
              <span class="font-semibold">簡易畫板</span>
              <button id="clearCanvasButton" class="rounded-lg border border-slate-300 px-3 py-2 font-semibold hover:bg-slate-50">
                清除畫板
              </button>
            </div>
            <canvas id="drawingCanvas" width="900" height="420" class="h-auto w-full touch-none rounded-lg border border-slate-300 bg-white"></canvas>
          </div>

          <button id="submitButton" class="rounded-lg bg-cyan-700 px-5 py-4 text-lg font-bold text-white hover:bg-cyan-800 disabled:bg-slate-400">
            送出 / 更新答案
          </button>
        </div>
      </section>
    </main>

    <script type="module">
      import { auth, db } from "./firebase-config.js";
      import {
        onAuthStateChanged,
        signInAnonymously,
      } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
      import {
        ref,
        onValue,
        set,
        get,
      } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

      const sessionRef = ref(db, "labSession/current");

      const authStatusTitle = document.querySelector("#authStatusTitle");
      const authStatusDetail = document.querySelector("#authStatusDetail");
      const studentUidText = document.querySelector("#studentUidText");
      const databaseStatusBox = document.querySelector("#databaseStatusBox");
      const databaseStatusTitle = document.querySelector("#databaseStatusTitle");
      const databaseStatusDetail = document.querySelector("#databaseStatusDetail");
      const courseTitle = document.querySelector("#courseTitle");
      const groupSelect = document.querySelector("#groupSelect");
      const groupCodeInput = document.querySelector("#groupCodeInput");
      const confirmGroupButton = document.querySelector("#confirmGroupButton");
      const changeGroupButton = document.querySelector("#changeGroupButton");
      const cancelChangeGroupButton = document.querySelector("#cancelChangeGroupButton");
      const groupHint = document.querySelector("#groupHint");
      const questionText = document.querySelector("#questionText");
      const timer = document.querySelector("#timer");
      const timerStatus = document.querySelector("#timerStatus");
      const answerInput = document.querySelector("#answerInput");
      const urlInput = document.querySelector("#urlInput");
      const canvas = document.querySelector("#drawingCanvas");
      const clearCanvasButton = document.querySelector("#clearCanvasButton");
      const submitButton = document.querySelector("#submitButton");
      const ctx = canvas.getContext("2d");
      const STUDENT_BINDING_STORAGE_KEY = "physicsLabStudentBinding";

      let session = null;
      let currentUser = null;
      let activeMember = null;
      let selectedGroup = "";
      let isDrawing = false;
      let loadedAnswerGroup = "";
      let studentAuthReady = false;
      let anonymousSignInInProgress = false;
      let databaseAvailable = true;
      let unsubscribeMember = null;
      let memberListenerUid = "";
      let changeGroupMode = false;
      let groupVerificationPending = false;

      ctx.lineWidth = 4;
      ctx.lineCap = "round";
      ctx.strokeStyle = "#0f172a";

      function formatTime(ms) {
        const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
        const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, "0");
        const seconds = String(totalSeconds % 60).padStart(2, "0");
        return `${minutes}:${seconds}`;
      }

      function getRemainingMs() {
        if (!session) return 0;
        if (session.status === "paused") return session.remainingMs || 0;
        if (session.status === "locked") return 0;
        return Math.max(0, (session.endsAt || 0) - Date.now());
      }

      function isAnswerLocked() {
        return !studentAuthReady || changeGroupMode || !isActiveMemberValid() || !session || session.status === "paused" || session.status === "locked" || getRemainingMs() <= 0;
      }

      function updateDisabledState() {
        const locked = isAnswerLocked();
        const sessionReady = Boolean(session?.sessionId);
        const canVerifyGroup = studentAuthReady && sessionReady && !groupVerificationPending && (!isActiveMemberValid() || changeGroupMode);

        groupSelect.disabled = !canVerifyGroup;
        groupCodeInput.disabled = !canVerifyGroup;
        confirmGroupButton.disabled = !canVerifyGroup;
        changeGroupButton.classList.toggle("hidden", !isActiveMemberValid() || changeGroupMode);
        cancelChangeGroupButton.classList.toggle("hidden", !isActiveMemberValid() || !changeGroupMode);
        answerInput.disabled = locked;
        urlInput.disabled = locked;
        submitButton.disabled = locked;
        clearCanvasButton.disabled = locked;
        canvas.style.pointerEvents = locked ? "none" : "auto";
      }

      function setDatabaseAvailable(isAvailable) {
        databaseAvailable = isAvailable;
        databaseStatusBox.classList.toggle("hidden", databaseAvailable || !studentAuthReady);
      }

      function showDatabaseStatus(title, detail) {
        databaseStatusTitle.textContent = title;
        databaseStatusDetail.textContent = detail;
        databaseAvailable = false;
        databaseStatusBox.classList.remove("hidden");
      }

      function showAuthInitializing() {
        studentAuthReady = false;
        authStatusTitle.textContent = "正在建立學生裝置驗證...";
        authStatusDetail.textContent = "";
        studentUidText.textContent = "";
        studentUidText.classList.add("hidden");
        databaseStatusBox.classList.add("hidden");
        stopMemberListener();
        updateDisabledState();
      }

      function showAnonymousAuthReady(user) {
        currentUser = user;
        studentAuthReady = true;
        authStatusTitle.textContent = "學生裝置驗證完成";
        authStatusDetail.textContent = "請選擇組別並輸入本場次驗證碼。";
        studentUidText.textContent = `Firebase UID：${user.uid}`;
        studentUidText.classList.remove("hidden");
        setDatabaseAvailable(databaseAvailable);
        startMemberListener(user.uid);
        applySessionAndMemberState();
        updateDisabledState();
      }

      function showAnonymousAuthError(error) {
        const messages = {
          "auth/operation-not-allowed": "Firebase Anonymous Authentication 尚未啟用，請到 Firebase Console 開啟匿名登入。",
          "auth/network-request-failed": "網路連線失敗，請確認連線後重新整理頁面。",
        };

        studentAuthReady = false;
        authStatusTitle.textContent = "無法建立學生裝置驗證。";
        authStatusDetail.textContent = messages[error.code] || `錯誤資訊：${error.message}`;
        studentUidText.textContent = "";
        studentUidText.classList.add("hidden");
        databaseStatusBox.classList.add("hidden");
        stopMemberListener();
        updateDisabledState();
      }

      function showNonAnonymousUserConflict(user) {
        currentUser = null;
        studentAuthReady = false;
        authStatusTitle.textContent = "目前瀏覽器已有 Google 登入身分。";
        authStatusDetail.textContent = `目前身分：${user.email || user.displayName || user.uid}。學生頁需要使用匿名學生身分。測試時請使用無痕視窗、其他瀏覽器，或另一個瀏覽器使用者設定檔開啟學生頁。`;
        studentUidText.textContent = "";
        studentUidText.classList.add("hidden");
        databaseStatusBox.classList.add("hidden");
        stopMemberListener();
        updateDisabledState();
      }

      function showDatabasePermissionError(error) {
        console.error("Student Authentication passed, but Realtime Database Rules denied access.", error);
        showDatabaseStatus("資料讀取受限", "目前無法讀取課堂資料，請確認老師是否已套用本階段的 Database Rules。");
      }

      async function runDatabaseAction(action) {
        try {
          return await action();
        } catch (error) {
          showDatabasePermissionError(error);
          return null;
        }
      }

      function clearAnswerFields() {
        answerInput.value = "";
        urlInput.value = "";
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }

      function getCachedBinding() {
        try {
          return JSON.parse(localStorage.getItem(STUDENT_BINDING_STORAGE_KEY) || "null");
        } catch {
          return null;
        }
      }

      function setCachedBinding(member) {
        if (!member?.sessionId || !member?.groupId) return;
        localStorage.setItem(STUDENT_BINDING_STORAGE_KEY, JSON.stringify({
          sessionId: member.sessionId,
          groupId: member.groupId,
        }));
      }

      function clearCachedBinding() {
        localStorage.removeItem(STUDENT_BINDING_STORAGE_KEY);
        localStorage.removeItem("physicsLabSelectedGroup");
      }

      function getGroupLabel(groupId) {
        const groupNumber = String(groupId || "").replace("group-", "");
        return groupNumber ? `第 ${groupNumber} 組` : "未選擇組別";
      }

      function isSelectableGroup(groupId) {
        return [...groupSelect.options].some((option) => option.value === groupId);
      }

      function isActiveMemberValid() {
        return Boolean(
          studentAuthReady &&
          session?.sessionId &&
          activeMember?.sessionId === session.sessionId &&
          activeMember?.groupId &&
          activeMember.groupId === selectedGroup,
        );
      }

      function applySessionAndMemberState() {
        if (!session?.sessionId) {
          selectedGroup = "";
          loadedAnswerGroup = "";
          changeGroupMode = false;
          groupVerificationPending = false;
          clearCachedBinding();
          clearAnswerFields();
          groupHint.textContent = "老師尚未建立本次課堂場次。";
          authStatusDetail.textContent = studentAuthReady ? "老師尚未建立本次課堂場次。" : authStatusDetail.textContent;
          updateDisabledState();
          return;
        }

        if (activeMember?.sessionId === session.sessionId && activeMember?.groupId) {
          const groupChanged = selectedGroup !== activeMember.groupId;
          selectedGroup = activeMember.groupId;
          changeGroupMode = false;
          groupVerificationPending = false;
          groupSelect.value = isSelectableGroup(selectedGroup) ? selectedGroup : groupSelect.value;
          groupCodeInput.value = "";
          groupHint.textContent = `本場次已驗證：${getGroupLabel(selectedGroup)}`;
          authStatusDetail.textContent = "學生裝置驗證完成。";
          setCachedBinding(activeMember);

          if (groupChanged) {
            loadedAnswerGroup = "";
            clearAnswerFields();
          }

          if (loadedAnswerGroup !== selectedGroup) {
            loadExistingAnswer(selectedGroup);
          }

          updateDisabledState();
          return;
        }

        const hadSelectedGroup = Boolean(selectedGroup);
        const hasStaleMember = Boolean(activeMember);
        selectedGroup = "";
        loadedAnswerGroup = "";
        changeGroupMode = false;
        groupVerificationPending = false;
        if (hadSelectedGroup || activeMember) clearAnswerFields();

        const cachedBinding = getCachedBinding();
        if (cachedBinding?.sessionId === session.sessionId && cachedBinding?.groupId && isSelectableGroup(cachedBinding.groupId)) {
          groupSelect.value = cachedBinding.groupId;
        }

        clearCachedBinding();
        groupHint.textContent = hasStaleMember || hadSelectedGroup ? "新的課堂場次，請重新驗證組別。" : "學生裝置驗證完成，請選擇組別並輸入本場次驗證碼。";
        authStatusDetail.textContent = "請選擇組別並輸入本場次驗證碼。";
        updateDisabledState();
      }

      function stopMemberListener() {
        unsubscribeMember?.();
        unsubscribeMember = null;
        memberListenerUid = "";
        currentUser = null;
        activeMember = null;
        selectedGroup = "";
        loadedAnswerGroup = "";
        changeGroupMode = false;
        groupVerificationPending = false;
      }

      function startMemberListener(uid) {
        if (unsubscribeMember && memberListenerUid === uid) return;
        unsubscribeMember?.();
        unsubscribeMember = null;
        memberListenerUid = uid;

        unsubscribeMember = onValue(
          ref(db, `labSession/private/members/${uid}`),
          (snapshot) => {
            activeMember = snapshot.val();
            applySessionAndMemberState();
          },
          (error) => {
            console.error("Unable to read this student's member binding.", error);
            showDatabaseStatus("組別驗證狀態無法讀取", "目前無法讀取本裝置的組別驗證狀態，請重新整理後再試一次。");
          },
        );
      }

      function renderGroups(groupCount) {
        const previousValue = selectedGroup || groupSelect.value;
        groupSelect.replaceChildren();

        for (let groupNumber = 1; groupNumber <= groupCount; groupNumber += 1) {
          const option = document.createElement("option");
          option.value = `group-${groupNumber}`;
          option.textContent = `第 ${groupNumber} 組`;
          groupSelect.append(option);
        }

        if (previousValue && [...groupSelect.options].some((option) => option.value === previousValue)) {
          groupSelect.value = previousValue;
        }

        if (previousValue && [...groupSelect.options].some((option) => option.value === previousValue)) {
          groupSelect.value = previousValue;
        }

        applySessionAndMemberState();
      }

      async function loadExistingAnswer(groupId = selectedGroup) {
        if (!groupId || !isActiveMemberValid()) return;
        const requestGroup = groupId;
        loadedAnswerGroup = requestGroup;
        let snapshot = null;

        try {
          snapshot = await get(ref(db, `labSession/answers/${requestGroup}`));
        } catch (error) {
          console.error("Unable to load this group's answer.", error);
          groupHint.textContent = "目前無法讀取本組答案，請重新確認組別驗證狀態。";
          updateDisabledState();
          return;
        }

        if (!snapshot || selectedGroup !== requestGroup || loadedAnswerGroup !== requestGroup) return;
        const answer = snapshot.val();
        if (!answer) {
          clearAnswerFields();
          return;
        }

        answerInput.value = answer.text || "";
        urlInput.value = answer.url || "";

        if (answer.image && answer.image.startsWith("data:image/")) {
          const image = new Image();
          image.onload = () => {
            if (selectedGroup !== requestGroup || loadedAnswerGroup !== requestGroup) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
          };
          image.src = answer.image;
        }
      }

      function updateTimer() {
        if (!session) {
          timer.textContent = "--:--";
          timerStatus.textContent = "等待老師發布";
          updateDisabledState();
          return;
        }

        const remainingMs = getRemainingMs();
        timer.textContent = formatTime(remainingMs);

        if (session.status === "paused") {
          timerStatus.textContent = "計時暫停，輸入已凍結";
        } else if (session.status === "locked" || remainingMs <= 0) {
          timerStatus.textContent = "作答已鎖定";
        } else {
          timerStatus.textContent = "可以作答";
        }

        updateDisabledState();
      }

      function getCanvasPoint(event) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        return {
          x: (event.clientX - rect.left) * scaleX,
          y: (event.clientY - rect.top) * scaleY,
        };
      }

      canvas.addEventListener("pointerdown", (event) => {
        if (isAnswerLocked()) return;
        isDrawing = true;
        canvas.setPointerCapture(event.pointerId);
        const point = getCanvasPoint(event);
        ctx.beginPath();
        ctx.moveTo(point.x, point.y);
      });

      canvas.addEventListener("pointermove", (event) => {
        if (!isDrawing || isAnswerLocked()) return;
        const point = getCanvasPoint(event);
        ctx.lineTo(point.x, point.y);
        ctx.stroke();
      });

      canvas.addEventListener("pointerup", () => {
        isDrawing = false;
      });

      canvas.addEventListener("pointercancel", () => {
        isDrawing = false;
      });

      clearCanvasButton.addEventListener("click", () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      });

      groupCodeInput.addEventListener("input", () => {
        groupCodeInput.value = groupCodeInput.value.replace(/\D/g, "").slice(0, 6);
      });

      confirmGroupButton.addEventListener("click", async () => {
        if (!studentAuthReady || !currentUser?.isAnonymous) return;
        if (!session?.sessionId) {
          groupHint.textContent = "老師尚未建立本次課堂場次。";
          return;
        }

        const groupId = groupSelect.value;
        const code = groupCodeInput.value.trim();

        if (!isSelectableGroup(groupId)) {
          groupHint.textContent = "請選擇有效的組別。";
          return;
        }

        if (!/^\d{6}$/.test(code)) {
          groupHint.textContent = "請輸入 6 位數組別驗證碼。";
          return;
        }

        confirmGroupButton.disabled = true;
        confirmGroupButton.textContent = "正在驗證組別...";
        groupVerificationPending = true;
        groupHint.textContent = "驗證已送出，正在確認組別狀態...";

        try {
          await set(ref(db, `labSession/private/members/${currentUser.uid}`), {
            sessionId: session.sessionId,
            groupId,
            code,
            boundAt: Date.now(),
          });
          groupCodeInput.value = "";
        } catch (error) {
          console.error("Group verification was rejected.", error);
          groupVerificationPending = false;
          groupHint.textContent = changeGroupMode ? "新組別或驗證碼不正確，請確認後再試一次。" : "組別或驗證碼不正確，或老師已建立新的課堂場次，請重新確認。";
        } finally {
          confirmGroupButton.textContent = "驗證並確認組別";
          updateDisabledState();
        }
      });

      changeGroupButton.addEventListener("click", () => {
        if (!isActiveMemberValid()) return;
        if (!confirm("確定要更換組別嗎？\n\n更換後需要輸入新組別的驗證碼。\n\n原組已送出的答案不會因此刪除。")) return;
        changeGroupMode = true;
        groupVerificationPending = false;
        groupCodeInput.value = "";
        groupHint.textContent = "請輸入新組驗證碼。";
        updateDisabledState();
      });

      cancelChangeGroupButton.addEventListener("click", () => {
        changeGroupMode = false;
        groupVerificationPending = false;
        groupCodeInput.value = "";
        if (activeMember?.groupId && isSelectableGroup(activeMember.groupId)) {
          groupSelect.value = activeMember.groupId;
        }
        groupHint.textContent = `本場次已驗證：${getGroupLabel(selectedGroup)}`;
        updateDisabledState();
      });

      submitButton.addEventListener("click", async () => {
        if (!isActiveMemberValid() || isAnswerLocked()) return;
        if (!confirm("確定要送出或更新本組答案嗎？")) return;

        try {
          await set(ref(db, `labSession/answers/${selectedGroup}`), {
            text: answerInput.value.trim(),
            url: urlInput.value.trim(),
            image: canvas.toDataURL("image/png"),
            submittedAt: Date.now(),
          });
        } catch (error) {
          console.error("Unable to submit answer.", error);
          groupHint.textContent = "目前無法送出答案。可能原因：作答已暫停、時間已結束，或組別驗證已失效。";
          updateDisabledState();
          return;
        }

        alert("答案已送出。");
      });

      onAuthStateChanged(auth, async (user) => {
        if (!user) {
          currentUser = null;
          showAuthInitializing();

          if (anonymousSignInInProgress) return;
          anonymousSignInInProgress = true;

          try {
            await signInAnonymously(auth);
          } catch (error) {
            showAnonymousAuthError(error);
          } finally {
            anonymousSignInInProgress = false;
          }

          return;
        }

        if (!user.isAnonymous) {
          showNonAnonymousUserConflict(user);
          return;
        }

        showAnonymousAuthReady(user);
      });

      onValue(
        sessionRef,
        (snapshot) => {
          setDatabaseAvailable(true);
          session = snapshot.val();
          const groupCount = Number(session?.groupCount || 6);

          courseTitle.textContent = session?.title || "學生作答頁";
          questionText.textContent = session?.question || "等待老師發布題目";
          renderGroups(groupCount);
          applySessionAndMemberState();
          updateTimer();
        },
        showDatabasePermissionError,
      );

      setInterval(updateTimer, 500);
