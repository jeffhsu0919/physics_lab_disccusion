<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Physics Lab Discussion | 大螢幕展示頁</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
    />
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
    ></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-white">
    <main class="mx-auto flex min-h-screen max-w-7xl flex-col gap-6 p-6">
      <header class="flex flex-col gap-4 border-b border-white/15 pb-5 md:flex-row md:items-end md:justify-between">
        <div class="min-w-0">
          <p class="text-sm font-medium uppercase tracking-[0.2em] text-cyan-300">Physics Lab Discussion</p>
          <h1 id="courseTitle" class="mt-2 text-4xl font-bold md:text-6xl">物理實驗課 - 分組討論</h1>
          <p id="displayAuthStatus" class="mt-3 text-sm font-semibold text-cyan-100">正在建立大螢幕展示身分...</p>
          <p id="displayDataStatus" class="mt-1 hidden text-sm text-amber-200"></p>
        </div>
        <div class="flex flex-col gap-3 sm:flex-row sm:items-stretch md:shrink-0">
          <div class="rounded-lg bg-white p-3 text-center text-slate-950">
            <p class="mb-2 text-sm font-semibold text-slate-700">掃描進入學生作答頁</p>
            <a href="./student.html" target="_blank" rel="noopener noreferrer" aria-label="開啟學生作答頁">
              <img
                src="./QR code for students.jpg"
                alt="學生作答頁 QR Code"
                class="mx-auto h-40 w-40 max-w-full object-contain"
              />
            </a>
          </div>
          <div class="rounded-lg bg-white px-5 py-4 text-slate-950">
            <p class="text-sm font-semibold text-slate-500">倒數時間</p>
            <p id="timer" class="font-mono text-5xl font-black md:text-7xl">--:--</p>
            <p id="timerStatus" class="mt-1 text-base font-semibold text-slate-600">等待老師發布題目</p>
          </div>
        </div>
      </header>

      <section class="rounded-lg border border-cyan-300/30 bg-cyan-300/10 p-5">
        <p class="mb-2 text-sm font-semibold text-cyan-200">目前題目</p>
        <div id="questionText" class="text-2xl font-semibold leading-relaxed md:text-4xl">
          尚未發布題目
        </div>
      </section>

      <section>
        <div class="mb-4 flex items-center justify-between">
          <h2 class="text-2xl font-bold">各組回答</h2>
          <p id="submitCount" class="text-lg font-semibold text-cyan-200">已繳交 0 / 0 組</p>
        </div>
        <div id="answersGrid" class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3"></div>
      </section>
    </main>

    <div
      id="answerModal"
      class="fixed inset-0 z-50 hidden bg-slate-950/80 p-4"
      role="dialog"
      aria-modal="true"
      aria-labelledby="answerModalTitle"
    >
      <div class="flex min-h-full items-center justify-center">
        <section id="answerModalPanel" class="max-h-[90vh] w-full max-w-6xl overflow-y-auto rounded-lg bg-white p-6 text-slate-950 shadow-2xl">
          <div class="mb-5 flex flex-col gap-4 border-b border-slate-200 pb-4 sm:flex-row sm:items-start sm:justify-between">
            <div>
              <h2 id="answerModalTitle" class="text-4xl font-black">第 1 組</h2>
              <p id="answerModalPosition" class="mt-2 text-lg font-semibold text-slate-500">第 1 組 / 共 1 組</p>
            </div>
            <div class="flex flex-wrap gap-2">
              <button id="previousAnswerModalButton" class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-lg font-bold text-slate-900 hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-40">
                上一組
              </button>
              <button id="nextAnswerModalButton" class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-lg font-bold text-slate-900 hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-40">
                下一組
              </button>
              <button id="closeAnswerModalButton" class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-lg font-bold text-slate-900 hover:bg-slate-50">
                關閉
              </button>
            </div>
          </div>
          <div id="answerModalText" class="whitespace-pre-wrap text-3xl font-semibold leading-relaxed"></div>
          <a id="answerModalUrl" class="mt-6 hidden break-all text-2xl font-bold text-blue-700 underline" target="_blank" rel="noopener noreferrer"></a>
          <div id="answerModalImageWrap" class="mt-6 hidden rounded-lg border border-slate-200 bg-slate-50 p-3">
            <img id="answerModalImage" class="max-h-[60vh] w-full object-contain" alt="" />
          </div>
        </section>
      </div>
    </div>

    <script type="module">
      import { app as defaultApp } from "./firebase-config.js";
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
      import {
        browserLocalPersistence,
        initializeAuth,
        onAuthStateChanged,
        signInAnonymously,
        signOut,
      } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
      import {
        getDatabase,
        ref,
        onValue,
      } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

      const displayApp = initializeApp(defaultApp.options, "physics-lab-display");
      const displayAuth = initializeAuth(displayApp, {
        persistence: browserLocalPersistence,
      });
      const displayDb = getDatabase(displayApp);
      const pairingChannel = "BroadcastChannel" in window ? new BroadcastChannel("physics-lab-display-pairing") : null;

      const sessionRef = ref(displayDb, "labSession/current");
      const answersRef = ref(displayDb, "labSession/answers");

      const courseTitle = document.querySelector("#courseTitle");
      const displayAuthStatus = document.querySelector("#displayAuthStatus");
      const displayDataStatus = document.querySelector("#displayDataStatus");
      const timer = document.querySelector("#timer");
      const timerStatus = document.querySelector("#timerStatus");
      const questionText = document.querySelector("#questionText");
      const answersGrid = document.querySelector("#answersGrid");
      const submitCount = document.querySelector("#submitCount");
      const answerModal = document.querySelector("#answerModal");
      const answerModalPanel = document.querySelector("#answerModalPanel");
      const answerModalTitle = document.querySelector("#answerModalTitle");
      const answerModalPosition = document.querySelector("#answerModalPosition");
      const answerModalText = document.querySelector("#answerModalText");
      const answerModalUrl = document.querySelector("#answerModalUrl");
      const answerModalImageWrap = document.querySelector("#answerModalImageWrap");
      const answerModalImage = document.querySelector("#answerModalImage");
      const previousAnswerModalButton = document.querySelector("#previousAnswerModalButton");
      const nextAnswerModalButton = document.querySelector("#nextAnswerModalButton");
      const closeAnswerModalButton = document.querySelector("#closeAnswerModalButton");

      let session = null;
      let answers = {};
      let displayUser = null;
      let displayAuthorization = null;
      let displayAnonymousSignInInProgress = false;
      let unsubscribeSession = null;
      let unsubscribeAnswers = null;
      let unsubscribeDisplayAuthorization = null;
      let lastPairingRequestKey = "";
      let openModalGroupNumber = null;
      let lastModalTriggerElement = null;

      function setDisplayDataStatus(message) {
        displayDataStatus.textContent = message;
        displayDataStatus.classList.toggle("hidden", !message);
      }

      function stopDisplayDatabaseListeners() {
        unsubscribeSession?.();
        unsubscribeSession = null;
        stopAnswersListener();
        stopDisplayAuthorizationListener();
      }

      function stopAnswersListener() {
        unsubscribeAnswers?.();
        unsubscribeAnswers = null;
        answers = {};
        closeAnswerModal();
        renderAnswers();
      }

      function stopDisplayAuthorizationListener() {
        unsubscribeDisplayAuthorization?.();
        unsubscribeDisplayAuthorization = null;
        displayAuthorization = null;
      }

      function startDisplayDatabaseListeners() {
        if (unsubscribeSession) return;

        unsubscribeSession = onValue(
          sessionRef,
          (snapshot) => {
            const previousSessionId = session?.sessionId || "";
            session = snapshot.val();
            if (previousSessionId && previousSessionId !== session?.sessionId) {
              closeAnswerModal();
              setDisplayDataStatus("新的課堂場次，等待老師重新授權大螢幕展示。");
            }
            renderQuestion();
            renderAnswers();
            updateTimer();
            syncDisplayAuthorizationState();
          },
          (error) => {
            console.error("Display current read was denied or failed.", error);
            session = null;
            closeAnswerModal();
            setDisplayDataStatus("大螢幕展示身分已建立；目前無法讀取課堂題目資料。");
            renderQuestion();
            renderAnswers();
            updateTimer();
            syncDisplayAuthorizationState();
          },
        );
      }

      function startDisplayAuthorizationListener(uid) {
        if (unsubscribeDisplayAuthorization) return;

        unsubscribeDisplayAuthorization = onValue(
          ref(displayDb, `labSession/private/displayMembers/${uid}`),
          (snapshot) => {
            displayAuthorization = snapshot.val();
            syncDisplayAuthorizationState();
          },
          (error) => {
            console.error("Unable to read this display authorization.", error);
            displayAuthorization = null;
            setDisplayDataStatus("大螢幕展示身分已建立，但目前無法讀取展示授權狀態。");
            syncDisplayAuthorizationState();
          },
        );
      }

      function startAnswersListener() {
        if (unsubscribeAnswers) return;

        unsubscribeAnswers = onValue(
          answersRef,
          (snapshot) => {
            answers = snapshot.val() || {};
            setDisplayDataStatus("");
            renderAnswers();
          },
          (error) => {
            console.error("Authorized display could not read labSession/answers.", error);
            answers = {};
            closeAnswerModal();
            setDisplayDataStatus("大螢幕展示已授權，但目前無法讀取各組回答。");
            renderAnswers();
          },
        );
      }

      function isDisplayAuthorizationValid() {
        return Boolean(
          displayUser?.uid &&
          session?.sessionId &&
          displayAuthorization?.sessionId === session.sessionId,
        );
      }

      function requestDisplayPairingIfNeeded() {
        if (!pairingChannel || !displayUser?.uid || !session?.sessionId || isDisplayAuthorizationValid()) return;

        const requestKey = `${displayUser.uid}:${session.sessionId}`;
        if (lastPairingRequestKey === requestKey) return;

        lastPairingRequestKey = requestKey;
        pairingChannel.postMessage({
          type: "display-pairing-request",
          displayUid: displayUser.uid,
          sessionId: session.sessionId,
          requestedAt: Date.now(),
        });
      }

      function syncDisplayAuthorizationState() {
        if (!displayUser?.uid) {
          stopAnswersListener();
          return;
        }

        if (!session?.sessionId) {
          stopAnswersListener();
          displayAuthStatus.textContent = "大螢幕展示身分已建立，等待老師建立課堂場次。";
          return;
        }

        if (isDisplayAuthorizationValid()) {
          displayAuthStatus.textContent = "大螢幕展示已授權。";
          setDisplayDataStatus("");
          startAnswersListener();
          return;
        }

        stopAnswersListener();
        displayAuthStatus.textContent = "大螢幕展示身分已建立，等待老師授權顯示各組回答。";
        setDisplayDataStatus(pairingChannel ? "已送出本機配對要求，請在老師控制台授權。" : "此瀏覽器不支援大螢幕配對功能，請使用目前版本的 Chrome / Edge。");
        requestDisplayPairingIfNeeded();
      }

      async function ensureDisplayAnonymousAuth() {
        if (displayAnonymousSignInInProgress) return;
        displayAnonymousSignInInProgress = true;

        try {
          await signInAnonymously(displayAuth);
        } catch (error) {
          console.error("Unable to create display anonymous identity.", error);
          displayAuthStatus.textContent = `無法建立大螢幕展示身分：${error.message}`;
        } finally {
          displayAnonymousSignInInProgress = false;
        }
      }

      pairingChannel?.addEventListener("message", (event) => {
        const message = event.data || {};
        if (
          message.type !== "display-pairing-authorized" ||
          message.displayUid !== displayUser?.uid ||
          message.sessionId !== session?.sessionId
        ) {
          return;
        }

        setDisplayDataStatus("已收到老師授權通知，正在等待資料庫確認。");
      });

      function formatTime(ms) {
        const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
        const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, "0");
        const seconds = String(totalSeconds % 60).padStart(2, "0");
        return `${minutes}:${seconds}`;
      }

      function getRemainingMs() {
        if (!session) return 0;
        if (session.status === "paused") return session.remainingMs || 0;
        if (session.status === "locked") return 0;
        return Math.max(0, (session.endsAt || 0) - Date.now());
      }

      function renderMath(element) {
        if (!window.renderMathInElement) return;
        window.renderMathInElement(element, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false },
            { left: "\\(", right: "\\)", display: false },
            { left: "\\[", right: "\\]", display: true },
          ],
          throwOnError: false,
        });
      }

      function updateTimer() {
        if (!session) {
          timer.textContent = "--:--";
          timerStatus.textContent = "等待老師發布題目";
          return;
        }

        const remainingMs = getRemainingMs();
        timer.textContent = formatTime(remainingMs);

        if (session.status === "paused") {
          timerStatus.textContent = "計時暫停，作答已凍結";
        } else if (session.status === "locked" || remainingMs <= 0) {
          timerStatus.textContent = "作答已鎖定";
        } else {
          timerStatus.textContent = "討論進行中";
        }
      }

      function renderQuestion() {
        courseTitle.textContent = session?.title || "物理實驗課 - 分組討論";
        questionText.textContent = session?.question || "尚未發布題目";
        renderMath(questionText);
      }

      function getGroupCount() {
        return Math.max(0, Number(session?.groupCount || 0));
      }

      function renderAnswerModal(groupNumber) {
        const key = `group-${groupNumber}`;
        const answer = answers[key] || {};
        const groupCount = getGroupCount();

        answerModalTitle.textContent = `第 ${groupNumber} 組`;
        answerModalPosition.textContent = `第 ${groupNumber} 組 / 共 ${groupCount} 組`;
        previousAnswerModalButton.disabled = groupNumber <= 1;
        nextAnswerModalButton.disabled = groupNumber >= groupCount;
        answerModalText.textContent = answer.text || "尚未送出答案";
        renderMath(answerModalText);

        if (answer.url) {
          answerModalUrl.href = answer.url;
          answerModalUrl.textContent = answer.url;
          answerModalUrl.classList.remove("hidden");
        } else {
          answerModalUrl.href = "";
          answerModalUrl.textContent = "";
          answerModalUrl.classList.add("hidden");
        }

        if (answer.image && answer.image.startsWith("data:image/")) {
          answerModalImage.src = answer.image;
          answerModalImage.alt = `第 ${groupNumber} 組繪圖板`;
          answerModalImageWrap.classList.remove("hidden");
        } else {
          answerModalImage.removeAttribute("src");
          answerModalImage.alt = "";
          answerModalImageWrap.classList.add("hidden");
        }
      }

      function openAnswerModal(groupNumber, triggerElement = null) {
        openModalGroupNumber = groupNumber;
        lastModalTriggerElement = triggerElement;
        renderAnswerModal(groupNumber);
        answerModal.classList.remove("hidden");
        document.body.classList.add("overflow-hidden");
        closeAnswerModalButton.focus();
      }

      function closeAnswerModal() {
        if (openModalGroupNumber === null && answerModal.classList.contains("hidden")) return;
        openModalGroupNumber = null;
        answerModal.classList.add("hidden");
        document.body.classList.remove("overflow-hidden");
        if (lastModalTriggerElement?.isConnected) {
          lastModalTriggerElement.focus();
        }
        lastModalTriggerElement = null;
      }

      function navigateAnswerModal(offset) {
        if (openModalGroupNumber === null) return;

        const groupCount = getGroupCount();
        if (groupCount <= 0) return;

        const targetGroupNumber = openModalGroupNumber + offset;
        if (targetGroupNumber < 1 || targetGroupNumber > groupCount) return;

        openModalGroupNumber = targetGroupNumber;
        renderAnswerModal(openModalGroupNumber);
      }

      function isEditableEventTarget(target) {
        return Boolean(
          target?.closest?.("input, textarea, select") ||
          target?.closest?.("[contenteditable='true']") ||
          target?.isContentEditable,
        );
      }

      function createAnswerCard(groupNumber) {
        const key = `group-${groupNumber}`;
        const answer = answers[key] || {};
        const card = document.createElement("article");
        card.className = "min-h-64 cursor-pointer rounded-lg border border-white/15 bg-white p-5 text-slate-950 shadow-lg transition hover:-translate-y-0.5 hover:shadow-xl focus:outline-none focus:ring-4 focus:ring-cyan-300";
        card.tabIndex = 0;
        card.role = "button";
        card.setAttribute("aria-label", `開啟第 ${groupNumber} 組完整回答`);
        card.addEventListener("click", (event) => {
          if (event.target.closest("a")) return;
          openAnswerModal(groupNumber, card);
        });
        card.addEventListener("keydown", (event) => {
          if (event.target.closest("a")) return;
          if (event.key !== "Enter" && event.key !== " ") return;
          event.preventDefault();
          openAnswerModal(groupNumber, card);
        });

        const title = document.createElement("h3");
        title.className = "text-2xl font-black";
        title.textContent = `第 ${groupNumber} 組`;

        const answerText = document.createElement("div");
        answerText.className = "mt-4 whitespace-pre-wrap text-xl leading-relaxed";
        answerText.textContent = answer.text || "尚未送出答案";

        card.append(title, answerText);

        if (answer.url) {
          const link = document.createElement("a");
          link.className = "mt-4 inline-block break-all text-base font-semibold text-blue-700 underline";
          link.href = answer.url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = answer.url;
          link.addEventListener("click", (event) => {
            event.stopPropagation();
          });
          card.append(link);
        }

        if (answer.image && answer.image.startsWith("data:image/")) {
          const image = document.createElement("img");
          image.className = "mt-4 max-h-56 w-full rounded border border-slate-200 object-contain";
          image.src = answer.image;
          image.alt = `第 ${groupNumber} 組繪圖板`;
          card.append(image);
        }

        renderMath(answerText);
        return card;
      }

      function renderAnswers() {
        const groupCount = Math.max(0, Number(session?.groupCount || 0));
        answersGrid.replaceChildren();

        for (let groupNumber = 1; groupNumber <= groupCount; groupNumber += 1) {
          answersGrid.append(createAnswerCard(groupNumber));
        }

        const submitted = Object.values(answers).filter((answer) => answer?.submittedAt).length;
        submitCount.textContent = `已繳交 ${submitted} / ${groupCount} 組`;
        if (openModalGroupNumber !== null) {
          if (openModalGroupNumber < 1 || openModalGroupNumber > groupCount) {
            closeAnswerModal();
            return;
          }
          renderAnswerModal(openModalGroupNumber);
        }
      }

      previousAnswerModalButton.addEventListener("click", () => {
        navigateAnswerModal(-1);
      });

      nextAnswerModalButton.addEventListener("click", () => {
        navigateAnswerModal(1);
      });

      closeAnswerModalButton.addEventListener("click", closeAnswerModal);

      answerModal.addEventListener("click", (event) => {
        if (!answerModalPanel.contains(event.target)) {
          closeAnswerModal();
        }
      });

      answerModalPanel.addEventListener("click", (event) => {
        event.stopPropagation();
      });

      window.addEventListener("keydown", (event) => {
        if (openModalGroupNumber === null) return;

        if (event.key === "Escape") {
          closeAnswerModal();
          return;
        }

        if (isEditableEventTarget(event.target)) return;

        if (event.key === "ArrowLeft") {
          event.preventDefault();
          navigateAnswerModal(-1);
        } else if (event.key === "ArrowRight") {
          event.preventDefault();
          navigateAnswerModal(1);
        }
      });

      onAuthStateChanged(displayAuth, async (user) => {
        if (!user) {
          displayUser = null;
          displayAuthStatus.textContent = "正在建立大螢幕展示身分...";
          stopDisplayDatabaseListeners();
          await ensureDisplayAnonymousAuth();
          return;
        }

        if (!user.isAnonymous) {
          displayUser = null;
          displayAuthStatus.textContent = "正在重設大螢幕展示身分...";
          stopDisplayDatabaseListeners();
          await signOut(displayAuth);
          await ensureDisplayAnonymousAuth();
          return;
        }

        displayUser = user;
        displayAuthStatus.textContent = "大螢幕展示身分已建立";
        startDisplayAuthorizationListener(user.uid);
        startDisplayDatabaseListeners();
        syncDisplayAuthorizationState();
      });

      window.addEventListener("load", () => {
        renderQuestion();
        renderAnswers();
      });

      setInterval(updateTimer, 500);
    </script>
  </body>
</html>
