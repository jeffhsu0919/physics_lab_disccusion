<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Physics Lab Discussion | 老師控制台</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-900">
    <section id="authGate" class="mx-auto grid min-h-screen max-w-xl place-items-center p-5">
      <div class="w-full rounded-lg bg-white p-6 shadow-sm">
        <p class="text-sm font-semibold text-cyan-700">Physics Lab Discussion</p>
        <h1 class="mt-1 text-3xl font-bold">老師控制台</h1>
        <p id="authStatusText" class="mt-4 text-slate-700">正在確認教師登入狀態...</p>
        <div id="signedInInfo" class="mt-4 hidden rounded-lg border border-slate-200 bg-slate-50 p-4 text-sm text-slate-700">
          <p id="teacherNameText" class="font-semibold text-slate-900"></p>
          <p id="teacherEmailText" class="mt-1"></p>
          <p id="teacherUidText" class="mt-1 break-all font-mono"></p>
        </div>
        <div class="mt-6 grid gap-3 sm:grid-cols-2">
          <button id="googleSignInButton" class="rounded-lg bg-cyan-700 px-4 py-3 font-bold text-white hover:bg-cyan-800">
            使用 Google 帳號登入
          </button>
          <button id="signOutButton" class="hidden rounded-lg border border-slate-300 bg-white px-4 py-3 font-bold text-slate-900 hover:bg-slate-50">
            登出
          </button>
        </div>
      </div>
    </section>

    <main id="appShell" class="mx-auto hidden max-w-6xl gap-6 p-5 lg:grid-cols-[1.4fr_0.8fr]">
      <section class="rounded-lg bg-white p-6 shadow-sm lg:col-span-2">
        <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
          <p id="consoleTeacherEmailText" class="font-semibold text-slate-900">已登入：</p>
          <button id="consoleSignOutButton" class="rounded-lg border border-slate-300 bg-white px-4 py-3 font-bold text-slate-900 hover:bg-slate-50">
            登出
          </button>
        </div>
        <div id="databaseStatusBanner" class="mt-4 hidden rounded-lg border border-amber-300 bg-amber-50 p-4 text-amber-900">
          <p class="font-bold">Google Authentication 與教師授權已成功。</p>
          <p class="mt-1">目前 Realtime Database Rules 尚未開放，因此課程資料暫時無法讀取或寫入。這是目前開發階段的預期狀態。</p>
        </div>
      </section>

      <section class="rounded-lg bg-white p-6 shadow-sm lg:col-span-2">
        <div class="grid gap-5 lg:grid-cols-[1fr_1.2fr]">
          <div>
            <p class="text-sm font-semibold text-cyan-700">Session</p>
            <h2 class="mt-1 text-2xl font-bold">場次管理</h2>
            <div class="mt-4 grid gap-2 text-sm text-slate-700">
              <p class="font-semibold">目前場次</p>
              <p id="sessionIdText" class="select-text break-all font-mono text-base text-slate-900">尚未建立場次</p>
              <p class="mt-2 font-semibold">建立時間</p>
              <p id="sessionCreatedAtText">--</p>
              <p id="sessionNoticeText" class="text-amber-700">請先建立新場次，再發布本堂課題目。</p>
            </div>
            <div class="mt-5 grid gap-3 sm:grid-cols-2">
              <button id="newSessionButton" class="rounded-lg bg-cyan-700 px-4 py-3 font-bold text-white hover:bg-cyan-800">
                建立新場次
              </button>
              <button id="regenerateCodesButton" class="rounded-lg border border-slate-300 bg-white px-4 py-3 font-bold text-slate-900 hover:bg-slate-50">
                重新產生全部驗證碼
              </button>
            </div>
            <p id="sessionActionMessage" class="mt-3 text-sm font-semibold text-slate-600"></p>
          </div>

          <div>
            <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
              <h2 class="text-lg font-bold">本場次組別驗證碼</h2>
              <button id="copyCodesButton" class="rounded-lg border border-slate-300 bg-white px-4 py-2 font-bold text-slate-900 hover:bg-slate-50">
                複製全部驗證碼
              </button>
            </div>
            <div id="groupCodesList" class="mt-4 grid gap-2 sm:grid-cols-2"></div>
            <p id="copyCodesMessage" class="mt-3 text-sm font-semibold text-slate-600"></p>
          </div>

          <div class="lg:col-span-2">
            <div class="rounded-lg border border-slate-200 bg-slate-50 p-4">
              <div class="flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between">
                <div>
                  <h2 class="text-lg font-bold">大螢幕展示授權</h2>
                  <p id="displayPairingStatus" class="mt-2 text-sm text-slate-600">等待大螢幕展示頁提出授權要求。</p>
                  <p id="displayPairingUidText" class="mt-2 hidden select-text break-all font-mono text-sm text-slate-900"></p>
                </div>
                <button id="authorizeDisplayButton" class="hidden rounded-lg bg-cyan-700 px-4 py-3 font-bold text-white hover:bg-cyan-800">
                  授權此大螢幕展示頁
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="rounded-lg bg-white p-6 shadow-sm">
        <div class="mb-6">
          <p class="text-sm font-semibold text-cyan-700">Teacher Console</p>
          <h1 class="mt-1 text-3xl font-bold">老師控制台</h1>
        </div>

        <div class="grid gap-5">
          <label class="grid gap-2">
            <span class="font-semibold">課程 / 活動標題</span>
            <input
              id="titleInput"
              class="rounded-lg border border-slate-300 px-3 py-2 text-lg"
              value="實驗課程分組討論"
            />
          </label>

          <label class="grid gap-2">
            <span class="font-semibold">討論題目內容</span>
            <textarea
              id="questionInput"
              class="min-h-40 rounded-lg border border-slate-300 px-3 py-2 text-lg"
              placeholder="請輸入本次討論題目，例如：請用 $F=ma$ 說明小車受力與加速度的關係。"
            ></textarea>
          </label>

          <div class="grid gap-4 sm:grid-cols-3">
            <label class="grid gap-2">
              <span class="font-semibold">本節課組數</span>
              <input id="groupCountInput" type="number" min="1" max="20" value="6" class="rounded-lg border border-slate-300 px-3 py-2 text-lg" />
            </label>

            <label class="grid gap-2">
              <span class="font-semibold">討論時間（分鐘）</span>
              <input id="minutesInput" type="number" min="1" max="120" value="5" class="rounded-lg border border-slate-300 px-3 py-2 text-lg" />
            </label>

            <label class="grid gap-2">
              <span class="font-semibold">文字回答字元上限</span>
              <input id="answerCharLimitInput" type="number" min="1" max="5000" value="500" class="rounded-lg border border-slate-300 px-3 py-2 text-lg" />
            </label>
          </div>
        </div>

        <div class="mt-6 grid gap-3 sm:grid-cols-2">
          <button id="startButton" class="rounded-lg bg-cyan-700 px-4 py-3 font-bold text-white hover:bg-cyan-800">
            發布題目並開始計時
          </button>
          <button id="pauseButton" class="rounded-lg bg-amber-500 px-4 py-3 font-bold text-white hover:bg-amber-600">
            暫停 / 繼續計時
          </button>
          <button id="lockButton" class="rounded-lg bg-rose-600 px-4 py-3 font-bold text-white hover:bg-rose-700">
            提前結束 / 鎖定作答
          </button>
          <button id="clearButton" class="rounded-lg bg-slate-700 px-4 py-3 font-bold text-white hover:bg-slate-800">
            清空題目與回答
          </button>
          <button id="downloadButton" class="rounded-lg border border-slate-300 bg-white px-4 py-3 font-bold text-slate-900 hover:bg-slate-50 sm:col-span-2">
            下載全組回答 CSV
          </button>
        </div>
      </section>

      <aside class="grid gap-4 content-start">
        <section class="rounded-lg bg-white p-6 shadow-sm">
          <p class="text-sm font-semibold text-slate-500">目前狀態</p>
          <p id="statusText" class="mt-2 text-3xl font-black">尚未開始</p>
          <p id="remainingText" class="mt-3 font-mono text-5xl font-black text-cyan-700">--:--</p>
        </section>

        <section class="rounded-lg bg-white p-6 shadow-sm">
          <p class="text-sm font-semibold text-slate-500">繳交進度</p>
          <p id="submittedText" class="mt-2 text-4xl font-black">0 / 6</p>
          <div class="mt-4 h-3 overflow-hidden rounded-full bg-slate-200">
            <div id="submittedBar" class="h-full w-0 bg-cyan-600"></div>
          </div>
        </section>
      </aside>
    </main>

    <script type="module">
      import { auth, db } from "./firebase-config.js";
      import {
        GoogleAuthProvider,
        onAuthStateChanged,
        signInWithPopup,
        signOut,
      } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
      import {
        ref,
        onValue,
        update,
        get,
      } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

      const labSessionRef = ref(db, "labSession");
      const sessionRef = ref(db, "labSession/current");
      const answersRef = ref(db, "labSession/answers");
      const privateRef = ref(db, "labSession/private");
      const AUTHORIZED_TEACHER_UIDS = [
        "akdETs5IYlZm7C65Zfh6jAKBBvX2",
        // 請將授權老師的 Firebase UID 貼在這裡，例如：
        // "xxxxxxxxxxxxxxxxxxxx",
      ];

      const authGate = document.querySelector("#authGate");
      const appShell = document.querySelector("#appShell");
      const authStatusText = document.querySelector("#authStatusText");
      const signedInInfo = document.querySelector("#signedInInfo");
      const teacherNameText = document.querySelector("#teacherNameText");
      const teacherEmailText = document.querySelector("#teacherEmailText");
      const teacherUidText = document.querySelector("#teacherUidText");
      const googleSignInButton = document.querySelector("#googleSignInButton");
      const signOutButton = document.querySelector("#signOutButton");
      const consoleTeacherEmailText = document.querySelector("#consoleTeacherEmailText");
      const consoleSignOutButton = document.querySelector("#consoleSignOutButton");
      const databaseStatusBanner = document.querySelector("#databaseStatusBanner");
      const sessionIdText = document.querySelector("#sessionIdText");
      const sessionCreatedAtText = document.querySelector("#sessionCreatedAtText");
      const sessionNoticeText = document.querySelector("#sessionNoticeText");
      const newSessionButton = document.querySelector("#newSessionButton");
      const regenerateCodesButton = document.querySelector("#regenerateCodesButton");
      const sessionActionMessage = document.querySelector("#sessionActionMessage");
      const groupCodesList = document.querySelector("#groupCodesList");
      const copyCodesButton = document.querySelector("#copyCodesButton");
      const copyCodesMessage = document.querySelector("#copyCodesMessage");
      const displayPairingStatus = document.querySelector("#displayPairingStatus");
      const displayPairingUidText = document.querySelector("#displayPairingUidText");
      const authorizeDisplayButton = document.querySelector("#authorizeDisplayButton");
      const titleInput = document.querySelector("#titleInput");
      const questionInput = document.querySelector("#questionInput");
      const groupCountInput = document.querySelector("#groupCountInput");
      const minutesInput = document.querySelector("#minutesInput");
      const answerCharLimitInput = document.querySelector("#answerCharLimitInput");
      const startButton = document.querySelector("#startButton");
      const pauseButton = document.querySelector("#pauseButton");
      const lockButton = document.querySelector("#lockButton");
      const clearButton = document.querySelector("#clearButton");
      const downloadButton = document.querySelector("#downloadButton");
      const statusText = document.querySelector("#statusText");
      const remainingText = document.querySelector("#remainingText");
      const submittedText = document.querySelector("#submittedText");
      const submittedBar = document.querySelector("#submittedBar");

      let session = null;
      let answers = {};
      let privateSession = null;
      let unsubscribeSession = null;
      let unsubscribeAnswers = null;
      let unsubscribePrivate = null;
      let databaseAvailable = true;
      let currentTeacherUser = null;
      let pendingDisplayPairingRequest = null;
      let authorizedDisplayPairing = null;
      const pairingChannel = "BroadcastChannel" in window ? new BroadcastChannel("physics-lab-display-pairing") : null;

      function showLoginGate(message) {
        authStatusText.textContent = message;
        authGate.classList.remove("hidden");
        appShell.classList.add("hidden");
        appShell.classList.remove("grid");
      }

      function showTeacherConsole() {
        authGate.classList.add("hidden");
        appShell.classList.remove("hidden");
        appShell.classList.add("grid");
      }

      function setSignedInInfo(user) {
        if (!user) {
          signedInInfo.classList.add("hidden");
          teacherNameText.textContent = "";
          teacherEmailText.textContent = "";
          teacherUidText.textContent = "";
          consoleTeacherEmailText.textContent = "已登入：";
          signOutButton.classList.add("hidden");
          return;
        }

        teacherNameText.textContent = user.displayName || "已登入 Google 帳號";
        teacherEmailText.textContent = `Email：${user.email || "未提供"}`;
        teacherUidText.textContent = `Firebase UID：${user.uid}`;
        consoleTeacherEmailText.textContent = `已登入：${user.email || user.displayName || user.uid}`;
        signedInInfo.classList.remove("hidden");
        signOutButton.classList.remove("hidden");
      }

      function setDatabaseAvailable(isAvailable) {
        databaseAvailable = isAvailable;
        databaseStatusBanner.classList.toggle("hidden", databaseAvailable);
      }

      function resetDashboardState() {
        session = null;
        answers = {};
        privateSession = null;
        pendingDisplayPairingRequest = null;
        authorizedDisplayPairing = null;
        updateDashboard();
        renderSessionManagement();
        renderDisplayPairing();
      }

      function showDatabasePermissionError(error) {
        console.error("Authentication passed, but Realtime Database Rules denied access.", error);
        setDatabaseAvailable(false);
      }

      function stopDatabaseListeners() {
        unsubscribeSession?.();
        unsubscribeAnswers?.();
        unsubscribePrivate?.();
        unsubscribeSession = null;
        unsubscribeAnswers = null;
        unsubscribePrivate = null;
        resetDashboardState();
      }

      function startDatabaseListeners() {
        stopDatabaseListeners();

        unsubscribeSession = onValue(
          sessionRef,
          (snapshot) => {
            setDatabaseAvailable(true);
            const previousSessionId = session?.sessionId || "";
            session = snapshot.val();
            if (previousSessionId && previousSessionId !== session?.sessionId) {
              pendingDisplayPairingRequest = null;
              authorizedDisplayPairing = null;
            }

            if (session) {
              titleInput.value = session.title || "實驗課程分組討論";
              questionInput.value = session.question || "";
              groupCountInput.value = session.groupCount || 6;
              minutesInput.value = Math.round((session.durationMs || 300000) / 60000);
              answerCharLimitInput.value = sanitizeNumber(session.answerCharLimit, 500, 1, 5000);
            }

            updateDashboard();
            renderSessionManagement();
            renderDisplayPairing();
          },
          showDatabasePermissionError,
        );

        unsubscribeAnswers = onValue(
          answersRef,
          (snapshot) => {
            setDatabaseAvailable(true);
            answers = snapshot.val() || {};
            updateDashboard();
          },
          showDatabasePermissionError,
        );

        unsubscribePrivate = onValue(
          privateRef,
          (snapshot) => {
            setDatabaseAvailable(true);
            privateSession = snapshot.val();
            renderSessionManagement();
          },
          showDatabasePermissionError,
        );
      }

      async function runDatabaseAction(action) {
        try {
          return await action();
        } catch (error) {
          showDatabasePermissionError(error);
          return null;
        }
      }

      function formatTime(ms) {
        const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
        const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, "0");
        const seconds = String(totalSeconds % 60).padStart(2, "0");
        return `${minutes}:${seconds}`;
      }

      function getRemainingMs() {
        if (!session) return 0;
        if (session.status === "paused") return session.remainingMs || 0;
        if (session.status === "locked") return 0;
        return Math.max(0, (session.endsAt || 0) - Date.now());
      }

      function updateDashboard() {
        const groupCount = Number(session?.groupCount || groupCountInput.value || 6);
        const submitted = Object.values(answers).filter((answer) => answer?.submittedAt).length;
        const percent = groupCount > 0 ? Math.min(100, (submitted / groupCount) * 100) : 0;

        submittedText.textContent = `${submitted} / ${groupCount}`;
        submittedBar.style.width = `${percent}%`;
        remainingText.textContent = session ? formatTime(getRemainingMs()) : "--:--";

        if (!session) {
          statusText.textContent = "尚未開始";
        } else if (session.status === "paused") {
          statusText.textContent = "計時暫停";
        } else if (session.status === "locked" || getRemainingMs() <= 0) {
          statusText.textContent = "作答鎖定";
        } else {
          statusText.textContent = "討論進行中";
        }
      }

      function sanitizeNumber(value, fallback, min, max) {
        const number = Number(value);
        if (!Number.isFinite(number)) return fallback;
        return Math.min(max, Math.max(min, Math.floor(number)));
      }

      function formatDateTime(timestamp) {
        if (!timestamp) return "--";
        return new Intl.DateTimeFormat("zh-TW", {
          dateStyle: "short",
          timeStyle: "short",
        }).format(new Date(timestamp));
      }

      function generateSessionId() {
        if (crypto.randomUUID) return crypto.randomUUID();

        const bytes = new Uint8Array(16);
        crypto.getRandomValues(bytes);
        bytes[6] = (bytes[6] & 0x0f) | 0x40;
        bytes[8] = (bytes[8] & 0x3f) | 0x80;
        const hex = [...bytes].map((byte) => byte.toString(16).padStart(2, "0")).join("");
        return `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20)}`;
      }

      function generateSixDigitCode() {
        const values = new Uint32Array(1);
        const max = Math.floor(0xffffffff / 900000) * 900000;

        do {
          crypto.getRandomValues(values);
        } while (values[0] >= max);

        return String(100000 + (values[0] % 900000));
      }

      function generateGroupCodes(groupCount) {
        const usedCodes = new Set();
        const groupCodes = {};

        for (let groupNumber = 1; groupNumber <= groupCount; groupNumber += 1) {
          let code = generateSixDigitCode();
          while (usedCodes.has(code)) {
            code = generateSixDigitCode();
          }

          usedCodes.add(code);
          groupCodes[`group-${groupNumber}`] = code;
        }

        return groupCodes;
      }

      function getPrivateGroupCodes() {
        return privateSession?.groupCodes || {};
      }

      function getGroupCodeCount() {
        return Object.keys(getPrivateGroupCodes()).length;
      }

      function renderSessionManagement() {
        const sessionId = session?.sessionId || privateSession?.sessionId || "";
        sessionIdText.textContent = sessionId || "尚未建立場次";
        sessionCreatedAtText.textContent = formatDateTime(session?.sessionCreatedAt);
        sessionNoticeText.textContent = sessionId ? "同一場次內發布下一題時，Session ID 與驗證碼會維持不變。" : "請先建立新場次，再發布本堂課題目。";
        regenerateCodesButton.disabled = !sessionId;
        copyCodesButton.disabled = getGroupCodeCount() === 0;

        const groupCodes = getPrivateGroupCodes();
        const entries = Object.entries(groupCodes).sort(([groupA], [groupB]) => {
          return Number(groupA.replace("group-", "")) - Number(groupB.replace("group-", ""));
        });

        groupCodesList.replaceChildren();

        if (entries.length === 0) {
          const emptyText = document.createElement("p");
          emptyText.className = "text-sm text-slate-500";
          emptyText.textContent = "尚未建立組別驗證碼。";
          groupCodesList.append(emptyText);
          return;
        }

        entries.forEach(([group, code]) => {
          const groupNumber = group.replace("group-", "");
          const item = document.createElement("div");
          item.className = "flex items-center justify-between rounded-lg border border-slate-200 bg-slate-50 px-3 py-2";

          const label = document.createElement("span");
          label.className = "font-semibold text-slate-700";
          label.textContent = `第 ${groupNumber} 組`;

          const codeText = document.createElement("span");
          codeText.className = "select-text font-mono text-xl font-black text-slate-950";
          codeText.textContent = code;

          item.append(label, codeText);
          groupCodesList.append(item);
        });
      }

      function isAuthorizedTeacherUser(user = currentTeacherUser) {
        return Boolean(user?.uid && AUTHORIZED_TEACHER_UIDS.includes(user.uid));
      }

      function isDisplayPairingRequestValid(request) {
        return Boolean(
          request?.type === "display-pairing-request" &&
          typeof request.displayUid === "string" &&
          request.displayUid.trim() &&
          typeof request.sessionId === "string" &&
          request.sessionId.trim() &&
          session?.sessionId &&
          request.sessionId === session.sessionId,
        );
      }

      function renderDisplayPairing() {
        if (!pairingChannel) {
          displayPairingStatus.textContent = "此瀏覽器不支援大螢幕配對功能，請使用目前版本的 Chrome / Edge。";
          displayPairingUidText.classList.add("hidden");
          authorizeDisplayButton.classList.add("hidden");
          return;
        }

        if (!session?.sessionId) {
          displayPairingStatus.textContent = "請先建立課堂場次，再授權大螢幕展示頁。";
          displayPairingUidText.classList.add("hidden");
          authorizeDisplayButton.classList.add("hidden");
          return;
        }

        if (authorizedDisplayPairing?.sessionId === session.sessionId) {
          displayPairingStatus.textContent = "已授權本場次大螢幕展示。";
          displayPairingUidText.textContent = `Display UID：${authorizedDisplayPairing.displayUid}`;
          displayPairingUidText.classList.remove("hidden");
          authorizeDisplayButton.classList.add("hidden");
          return;
        }

        if (!isDisplayPairingRequestValid(pendingDisplayPairingRequest)) {
          displayPairingStatus.textContent = "等待大螢幕展示頁提出授權要求。";
          displayPairingUidText.classList.add("hidden");
          authorizeDisplayButton.classList.add("hidden");
          return;
        }

        displayPairingStatus.textContent = "偵測到本場次的大螢幕展示頁。";
        displayPairingUidText.textContent = `Display UID：${pendingDisplayPairingRequest.displayUid}`;
        displayPairingUidText.classList.remove("hidden");
        authorizeDisplayButton.classList.toggle("hidden", !isAuthorizedTeacherUser());
      }

      function getCurrentSessionPayload(sessionId, sessionCreatedAt, now, groupCount, durationMs) {
        return {
          sessionId,
          sessionCreatedAt,
          title: titleInput.value.trim() || "實驗課程分組討論",
          question: "",
          groupCount,
          durationMs,
          answerCharLimit: sanitizeNumber(answerCharLimitInput.value, 500, 1, 5000),
          status: "locked",
          startedAt: null,
          endsAt: null,
          remainingMs: 0,
          updatedAt: now,
        };
      }

      function getCodesText() {
        const entries = Object.entries(getPrivateGroupCodes()).sort(([groupA], [groupB]) => {
          return Number(groupA.replace("group-", "")) - Number(groupB.replace("group-", ""));
        });

        return [
          "Physics Lab Discussion 組別驗證碼",
          "",
          ...entries.map(([group, code]) => `第 ${group.replace("group-", "")} 組：${code}`),
        ].join("\n");
      }

      startButton.addEventListener("click", async () => {
        if (!session?.sessionId) {
          sessionActionMessage.textContent = "請先建立本堂課場次。";
          return;
        }

        const title = titleInput.value.trim() || "實驗課程分組討論";
        const question = questionInput.value.trim();
        const groupCount = sanitizeNumber(groupCountInput.value, 6, 1, 20);
        const codeCount = getGroupCodeCount();

        if (groupCount !== codeCount) {
          sessionActionMessage.textContent = `目前組數已由 ${codeCount} 組改為 ${groupCount} 組。請先按「重新產生全部驗證碼」，讓本場次的組別設定與驗證碼同步後，再發布題目。`;
          return;
        }

        const minutes = sanitizeNumber(minutesInput.value, 5, 1, 120);
        const answerCharLimit = sanitizeNumber(answerCharLimitInput.value, 500, 1, 5000);
        const durationMs = minutes * 60 * 1000;
        const now = Date.now();

        const result = await runDatabaseAction(() => update(sessionRef, {
          sessionId: session.sessionId,
          sessionCreatedAt: session.sessionCreatedAt,
          title,
          question,
          groupCount,
          durationMs,
          answerCharLimit,
          status: "running",
          startedAt: now,
          endsAt: now + durationMs,
          remainingMs: durationMs,
          updatedAt: now,
        }));
        if (result === null) return;
        sessionActionMessage.textContent = "";
        renderDisplayPairing();
      });

      pauseButton.addEventListener("click", async () => {
        if (!session) return;
        const now = Date.now();

        if (session.status === "running") {
          await runDatabaseAction(() => update(sessionRef, {
            status: "paused",
            remainingMs: getRemainingMs(),
            pausedAt: now,
            updatedAt: now,
          }));
          return;
        }

        if (session.status === "paused") {
          const remainingMs = session.remainingMs || 0;
          await runDatabaseAction(() => update(sessionRef, {
            status: "running",
            endsAt: now + remainingMs,
            pausedAt: null,
            updatedAt: now,
          }));
        }
      });

      lockButton.addEventListener("click", async () => {
        if (!session) return;
        await runDatabaseAction(() => update(sessionRef, {
          status: "locked",
          remainingMs: 0,
          endsAt: Date.now(),
          updatedAt: Date.now(),
        }));
      });

      clearButton.addEventListener("click", async () => {
        if (!session?.sessionId) {
          sessionActionMessage.textContent = "尚未建立場次，沒有可清空的題目與回答。";
          return;
        }

        if (!confirm("確定要清空目前題目與所有組別回答嗎？")) return;
        const result = await runDatabaseAction(() => update(labSessionRef, {
          "current/question": "",
          "current/status": "locked",
          "current/startedAt": null,
          "current/endsAt": null,
          "current/remainingMs": 0,
          "current/updatedAt": Date.now(),
          answers: null,
        }));
        if (result === null) return;
        sessionActionMessage.textContent = "已清空題目與回答，Session 與驗證碼已保留。";
      });

      newSessionButton.addEventListener("click", async () => {
        const hasSession = Boolean(session?.sessionId);
        const message = hasSession
          ? "建立新場次會：\n\n1. 結束目前場次\n2. 產生新的 Session ID\n3. 重新產生全部組別驗證碼\n4. 清除目前所有組別回答\n\n目前場次驗證碼將失效。\n\n確定建立新場次嗎？"
          : "建立新場次會產生 Session ID 與全部組別驗證碼。\n\n確定建立新場次嗎？";

        if (!confirm(message)) return;

        const now = Date.now();
        const groupCount = sanitizeNumber(groupCountInput.value, 6, 1, 20);
        const minutes = sanitizeNumber(minutesInput.value, 5, 1, 120);
        const durationMs = minutes * 60 * 1000;
        const sessionId = generateSessionId();
        const groupCodes = generateGroupCodes(groupCount);

        const result = await runDatabaseAction(() => update(labSessionRef, {
          current: getCurrentSessionPayload(sessionId, now, now, groupCount, durationMs),
          answers: null,
          private: {
            sessionId,
            codesUpdatedAt: now,
            groupCodes,
            members: null,
          },
        }));

        if (result === null) return;
        pendingDisplayPairingRequest = null;
        authorizedDisplayPairing = null;
        sessionActionMessage.textContent = "已建立新場次。";
        copyCodesMessage.textContent = "";
        renderDisplayPairing();
      });

      regenerateCodesButton.addEventListener("click", async () => {
        if (!session?.sessionId) {
          sessionActionMessage.textContent = "請先建立本堂課場次。";
          return;
        }

        if (!confirm("重新產生後，舊驗證碼將立即失效。\n\n確定重新產生本場次所有組別驗證碼嗎？")) return;

        const now = Date.now();
        const groupCount = sanitizeNumber(groupCountInput.value, 6, 1, 20);
        const groupCodes = generateGroupCodes(groupCount);

        const result = await runDatabaseAction(() => update(labSessionRef, {
          "current/groupCount": groupCount,
          "current/updatedAt": now,
          "private/sessionId": session.sessionId,
          "private/codesUpdatedAt": now,
          "private/groupCodes": groupCodes,
          "private/members": null,
        }));

        if (result === null) return;
        sessionActionMessage.textContent = "已重新產生全部驗證碼，並同步本場次組數。";
        copyCodesMessage.textContent = "";
      });

      authorizeDisplayButton.addEventListener("click", async () => {
        if (!isAuthorizedTeacherUser()) {
          displayPairingStatus.textContent = "目前教師登入狀態無效，無法授權大螢幕展示頁。";
          renderDisplayPairing();
          return;
        }

        if (!isDisplayPairingRequestValid(pendingDisplayPairingRequest)) {
          displayPairingStatus.textContent = "目前沒有符合本場次的大螢幕展示授權要求。";
          renderDisplayPairing();
          return;
        }

        const { displayUid, sessionId } = pendingDisplayPairingRequest;
        const result = await runDatabaseAction(() => update(labSessionRef, {
          [`private/displayMembers/${displayUid}`]: {
            sessionId,
            authorizedAt: Date.now(),
          },
        }));

        if (result === null) return;
        authorizedDisplayPairing = { displayUid, sessionId };
        pendingDisplayPairingRequest = null;
        renderDisplayPairing();
        pairingChannel?.postMessage({
          type: "display-pairing-authorized",
          displayUid,
          sessionId,
        });
      });

      copyCodesButton.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(getCodesText());
          copyCodesMessage.textContent = "已複製全部驗證碼";
        } catch (error) {
          console.error("Failed to copy group codes.", error);
          copyCodesMessage.textContent = "無法複製驗證碼，請確認瀏覽器是否允許 Clipboard API。";
        }
      });

      function csvEscape(value) {
        return `"${String(value ?? "").replaceAll('"', '""')}"`;
      }

      downloadButton.addEventListener("click", async () => {
        const snapshot = await runDatabaseAction(() => get(answersRef));
        if (!snapshot) return;
        const currentAnswers = snapshot.val() || {};
        const rows = [["group", "text", "url", "submittedAt"]];

        Object.entries(currentAnswers).forEach(([group, answer]) => {
          rows.push([
            group,
            answer.text || "",
            answer.url || "",
            answer.submittedAt ? new Date(answer.submittedAt).toISOString() : "",
          ]);
        });

        const csv = rows.map((row) => row.map(csvEscape).join(",")).join("\n");
        const blob = new Blob(["\ufeff", csv], { type: "text/csv;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `physics-lab-answers-${new Date().toISOString().slice(0, 10)}.csv`;
        link.click();
        URL.revokeObjectURL(url);
      });

      googleSignInButton.addEventListener("click", async () => {
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({
          prompt: "select_account",
        });

        googleSignInButton.disabled = true;
        googleSignInButton.textContent = "登入中...";

        try {
          await signInWithPopup(auth, provider);
        } catch (error) {
          const messages = {
            "auth/popup-closed-by-user": "登入視窗已關閉，請重新點選登入。",
            "auth/popup-blocked": "登入彈出視窗被瀏覽器阻擋，請允許彈出視窗後再試一次。",
            "auth/network-request-failed": "網路連線失敗，請確認連線後再試一次。",
            "auth/unauthorized-domain": "目前網域未列入 Firebase Authorized domains，請到 Firebase Console 加入此網域。",
          };

          authStatusText.textContent = messages[error.code] || `Google 登入失敗：${error.message}`;
        } finally {
          googleSignInButton.disabled = false;
          googleSignInButton.textContent = "使用 Google 帳號登入";
        }
      });

      signOutButton.addEventListener("click", async () => {
        stopDatabaseListeners();
        await signOut(auth);
      });

      consoleSignOutButton.addEventListener("click", async () => {
        stopDatabaseListeners();
        await signOut(auth);
      });

      pairingChannel?.addEventListener("message", (event) => {
        if (!isAuthorizedTeacherUser() || !session?.sessionId) return;

        const message = event.data || {};
        if (!isDisplayPairingRequestValid(message)) return;

        pendingDisplayPairingRequest = {
          type: "display-pairing-request",
          displayUid: message.displayUid,
          sessionId: message.sessionId,
          requestedAt: message.requestedAt || Date.now(),
        };
        renderDisplayPairing();
      });

      onAuthStateChanged(auth, (user) => {
        currentTeacherUser = user;
        setSignedInInfo(user);

        if (!user) {
          stopDatabaseListeners();
          setDatabaseAvailable(true);
          showLoginGate("請使用授權的 Google 帳號登入。");
          return;
        }

        if (!AUTHORIZED_TEACHER_UIDS.includes(user.uid)) {
          stopDatabaseListeners();
          setDatabaseAvailable(true);
          showLoginGate("這個 Google 帳號尚未授權使用老師控制台。請將上方 Firebase UID 加入 teacher.html 的 AUTHORIZED_TEACHER_UIDS。");
          return;
        }

        showTeacherConsole();
        startDatabaseListeners();
        renderDisplayPairing();
      });

      setInterval(updateDashboard, 500);
    </script>
  </body>
</html>
